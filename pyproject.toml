[project]
name = "mi-project"
version = "0.1.0"
description = "Merging Hindi and Marathi case probes on mBERT"
requires-python = "==3.14.*"
dependencies = [
    "torch==2.14.1",
    # Needed by the XPU torch; listed so that it is fetched from the XPU index.
    "triton-xpu==3.8.0; sys_platform != 'darwin'",
    "transformers==5.18.0",
    "scikit-learn==1.9.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "conllu==6.0.0",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",
]

[tool.uv]
package = false

# Intel XPU build of torch on Linux and Windows; it falls back to the CPU when no
# Intel GPU is present. macOS has no XPU build and gets the standard one.
[tool.uv.sources]
torch = [{ index = "pytorch-xpu", marker = "sys_platform != 'darwin'" }]
triton-xpu = [{ index = "pytorch-xpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
