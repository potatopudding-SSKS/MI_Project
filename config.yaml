model: google-bert/bert-base-multilingual-cased
labels: [Nom, Acc]
treebanks:
  hi: {name: Hindi, repo: UD_Hindi-HDTB, prefix: hi_hdtb, release: r2.18}
  mr: {name: Marathi, repo: UD_Marathi-CMUPAN, prefix: mr_cmupan, release: r2.18}
seeds: [13, 29, 43, 61, 89]
hindi_train_sentences: 800
marathi_train_sentences: [25, 50, 100, 200, 400, 800]
layers: 13
poolings: [first, last]
# The class result, reproduced as a check.
reproduction: {layer: 8, pooling: first}
# Layer 7 had the best 5-seed average on Marathi dev for both probes; last-piece
# pooling is dropped because the last piece is often just the Marathi case ending.
main_setting: {layer: 7, pooling: first}
# Share of each Marathi budget held out for the router and the blend weight.
router_share: 0.2
